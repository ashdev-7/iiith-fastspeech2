# FastSpeech 2 - Telugu (IndicTTS Telugu, both speakers). Loaded by fastspeech2/utils/config.py.
# Paths are relative to the data root (--data_root, default: this folder).
# Architecture, audio and variance settings follow the reference LJSpeech configs (ming024/FastSpeech2).
# train.step / anneal_steps: as used for the released Telugu model (Kaggle fs2-03-train-te:
# sized from a measured 2.08 steps/s on 2 x T4 for a 480-min budget; stopped by the budget at step 55524).

preprocess:
  dataset: "IndicTTS_Telugu"
  path:
    raw_path: "raw_data/te"                 # <speaker>/<utt>.wav + .lab (from data/ingest.py)
    split_path: "manifests/te"              # train.tsv / val.tsv (from data/select_split.py)
    preprocessed_path: "preprocessed/te"    # TextGrid/ goes in here before preprocessing
  preprocessing:
    text:
      language: "te"
      text_cleaners: []                     # text is G2P phones in {...}; see text/telugu
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000                        # matches the HiFi-GAN universal vocoder
    pitch:
      feature: "phoneme_level"
      normalization: true
    energy:
      feature: "phoneme_level"
      normalization: true

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256
  multi_speaker: true
  # Reference uses 1000 frames (11.6 s); clips here go up to 15 s = 1292 frames.
  max_seq_len: 1500
  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"

train:
  path:
    ckpt_path: "output/te/ckpt"
    log_path: "output/te/log"
    result_path: "output/te/result"
  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [18000, 24000, 31000]    # 1/3, 4/9, 5/9 of total_step (reference: 300k/400k/500k of 900k)
    anneal_rate: 0.3
  step:
    total_step: 56000
    log_step: 100
    synth_step: 2000
    val_step: 1000
    save_step: 10000
